<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <title>管理員 註冊與登入測試</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
        max-width: 800px;
        margin: 0 auto;
      }
      .container {
        display: flex;
        gap: 20px;
      }
      .box {
        border: 2px solid #ccc;
        padding: 20px;
        border-radius: 8px;
        flex: 1;
        background-color: #f9f9f9;
      }
      .form-group {
        margin-bottom: 15px;
      }
      label {
        display: inline-block;
        width: 100px;
        font-weight: bold;
      }
      input {
        padding: 8px;
        width: 200px;
      }
      button {
        padding: 10px 20px;
        cursor: pointer;
        background-color: #4caf50;
        color: white;
        border: none;
        border-radius: 4px;
        font-weight: bold;
      }
      button.login-btn {
        background-color: #2196f3;
      }
      pre {
        background: #222;
        color: #0f0;
        padding: 15px;
        border-radius: 5px;
        overflow-x: auto;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>🛡️ 管理員身分驗證測試區</h1>
    <p>
      請先在左邊註冊，然後用同一組帳密在右邊登入，看看能不能順利拿到 JWT
      通行證！
    </p>

    <div class="container">
      <div class="box">
        <h2>1. 註冊 (Register)</h2>
        <div class="form-group">
          <label>使用者名稱:</label>
          <input
            type="text"
            id="reg_username"
            placeholder="如: 王主任"
            required
          />
        </div>
        <div class="form-group">
          <label>Email:</label>
          <input
            type="email"
            id="reg_email"
            placeholder="如: admin@test.com"
            required
          />
        </div>
        <div class="form-group">
          <label>密碼:</label>
          <input
            type="password"
            id="reg_password"
            placeholder="請輸入密碼"
            required
          />
        </div>
        <button onclick="registerAdmin()">建立帳號</button>
      </div>

      <div class="box">
        <h2>2. 登入 (Login)</h2>
        <div class="form-group">
          <label>Email:</label>
          <input
            type="email"
            id="login_email"
            placeholder="輸入剛剛註冊的 Email"
            required
          />
        </div>
        <div class="form-group">
          <label>密碼:</label>
          <input
            type="password"
            id="login_password"
            placeholder="輸入密碼"
            required
          />
        </div>
        <button class="login-btn" onclick="loginAdmin()">登入獲取 Token</button>
      </div>
    </div>

    <h3>API 執行結果：</h3>
    <pre id="result">等待操作...</pre>

    <script>
      const resultDiv = document.getElementById("result");

      // --- 註冊功能 ---
      async function registerAdmin() {
        const username = document.getElementById("reg_username").value;
        const email = document.getElementById("reg_email").value;
        const password = document.getElementById("reg_password").value;

        if (!username || !email || !password) {
          resultDiv.innerText = "請填寫註冊的所有欄位！";
          return;
        }

        try {
          resultDiv.innerText = "註冊中，請稍候...";
          const response = await fetch("/api/admin/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            // 只傳送這三個欄位
            body: JSON.stringify({ username, email, password }),
          });

          const result = await response.json();
          resultDiv.innerText =
            "【註冊 API 回傳】\n" + JSON.stringify(result, null, 2);
        } catch (error) {
          resultDiv.innerText = "發生錯誤: " + error;
        }
      }

      // --- 登入功能 ---
      async function loginAdmin() {
        const email = document.getElementById("login_email").value;
        const password = document.getElementById("login_password").value;

        if (!email || !password) {
          resultDiv.innerText = "請填寫登入的 Email 與密碼！";
          return;
        }

        try {
          resultDiv.innerText = "登入驗證中，請稍候...";
          const response = await fetch("/api/admin/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password }),
          });

          const result = await response.json();
          resultDiv.innerText =
            "【登入 API 回傳】\n" + JSON.stringify(result, null, 2);

          if (result.token) {
            alert("🎉 登入成功！你已經拿到 JWT 通行證了！請看下方黑色區塊。");
          }
        } catch (error) {
          resultDiv.innerText = "發生錯誤: " + error;
        }
      }
    </script>
  </body>
</html>
