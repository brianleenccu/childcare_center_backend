<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <title>Administrator 註冊系統</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      .form-group {
        margin-bottom: 15px;
      }
      label {
        display: inline-block;
        width: 100px;
        font-weight: bold;
      }
      input {
        padding: 8px;
        width: 250px;
      }
      button {
        padding: 10px 20px;
        cursor: pointer;
      }
      #message {
        margin-top: 15px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h1>Administrator 註冊入口</h1>

    <div class="form-group">
      <label>中心 ID:</label>
      <input
        type="number"
        id="center_id"
        placeholder="請輸入 Center ID (例如: 1)"
        required
      />
    </div>
    <div class="form-group">
      <label>使用者名稱:</label>
      <input type="text" id="username" placeholder="請輸入 Username" required />
    </div>
    <div class="form-group">
      <label>Email:</label>
      <input type="email" id="email" placeholder="請輸入 Email" required />
    </div>
    <div class="form-group">
      <label>密碼:</label>
      <input type="password" id="password" placeholder="請輸入密碼" required />
    </div>

    <button onclick="registerAdmin()">註冊 (Register)</button>

    <div id="message"></div>

    <script>
      async function registerAdmin() {
        const center_id = document.getElementById("center_id").value;
        const username = document.getElementById("username").value;
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        const msgDiv = document.getElementById("message");

        if (!center_id || !username || !email || !password) {
          msgDiv.style.color = "red";
          msgDiv.innerText = "請填寫所有欄位！";
          return;
        }

        try {
          const response = await fetch("/api/admin/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ center_id, username, email, password }),
          });

          const result = await response.json();

          if (result.success) {
            msgDiv.style.color = "green";
            msgDiv.innerText = "註冊成功！";
            console.log("回傳資料:", result.data);
          } else {
            msgDiv.style.color = "red";
            msgDiv.innerText = "註冊失敗：" + result.error;
          }
        } catch (error) {
          console.error(error);
          msgDiv.innerText = "系統發生錯誤";
        }
      }
    </script>
  </body>
</html>
