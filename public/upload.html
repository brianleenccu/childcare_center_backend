<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>圖片上傳與查看系統</title>
    <style>
      body {
        font-family: sans-serif;
        max-width: 800px;
        margin: 0 auto;
        padding: 20px;
      }
      .form-group {
        margin-bottom: 15px;
      }
      label {
        display: inline-block;
        width: 100px;
        font-weight: bold;
      }
      input {
        padding: 5px;
        width: 250px;
      }
      hr {
        margin: 40px 0;
        border: 0;
        border-top: 1px solid #ccc;
      }

      /* 照片牆樣式 */
      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 20px;
        margin-top: 20px;
      }
      .photo-item {
        border: 1px solid #ddd;
        padding: 10px;
        border-radius: 8px;
        text-align: center;
      }
      .photo-item img {
        width: 100%;
        height: 150px;
        object-fit: cover;
        border-radius: 4px;
      }
      .photo-item p {
        margin: 10px 0 5px;
        font-weight: bold;
      }
      .photo-item small {
        color: #666;
        font-size: 0.8em;
      }
    </style>
  </head>
  <body>
    <h1>1. 設施照片上傳 (Admin)</h1>

    <div class="form-group">
      <label>中心編號:</label>
      <input type="number" id="center_id" placeholder="例如: 1" />
    </div>
    <div class="form-group">
      <label>照片說明:</label>
      <input type="text" id="caption" placeholder="請輸入說明 (如: 遊戲區)" />
    </div>
    <div class="form-group">
      <label>上傳時間:</label>
      <input type="datetime-local" id="uploaded_at" />
    </div>
    <div class="form-group">
      <label>選擇圖片:</label>
      <input type="file" id="photo" />
    </div>

    <button onclick="uploadPhoto()">上傳照片</button>

    <pre
      id="result"
      style="background: #eee; padding: 10px; margin-top: 10px"
    ></pre>
    <img id="preview" width="300" />

    <hr />

    <h1>2. 設施照片牆 (Visitor / Parent)</h1>
    <div class="form-group">
      <label>查詢中心 ID:</label>
      <input type="number" id="view_center_id" placeholder="輸入中心 ID" />
      <button onclick="getPhotos()">查詢照片牆</button>
    </div>

    <div id="photo-gallery" class="gallery"></div>

    <script>
      // --- 原有的上傳功能 ---
      async function uploadPhoto() {
        const fileInput = document.getElementById("photo");
        const center_id = document.getElementById("center_id").value;
        const caption = document.getElementById("caption").value;
        let uploaded_at = document.getElementById("uploaded_at").value;

        if (!fileInput.files[0] || !center_id) {
          alert("請填寫中心編號並選擇檔案");
          return;
        }

        const formData = new FormData();
        formData.append("photoblob", fileInput.files[0]);
        formData.append("center_id", center_id);
        formData.append("caption", caption);
        formData.append(
          "uploaded_at",
          uploaded_at
            ? new Date(uploaded_at).toISOString()
            : new Date().toISOString()
        );

        const response = await fetch("/api/photo/upload", {
          method: "POST",
          body: formData,
        });

        const result = await response.json();
        document.getElementById("result").innerText = JSON.stringify(
          result,
          null,
          2
        );
        if (result.imageUrl)
          document.getElementById("preview").src = result.imageUrl;
      }

      // --- 新增的 View 功能 ---
      async function getPhotos() {
        const centerId = document.getElementById("view_center_id").value;
        const gallery = document.getElementById("photo-gallery");

        if (!centerId) {
          alert("請輸入中心 ID 進行查詢");
          return;
        }

        try {
          // 清空之前的結果
          gallery.innerHTML = "讀取中...";

          // 呼叫你剛寫好的 GET API
          const response = await fetch(`/api/photo/center/${centerId}`);
          const result = await response.json();

          if (result.success) {
            gallery.innerHTML = ""; // 清空文字

            if (result.data.length === 0) {
              gallery.innerHTML = "<p>此中心目前沒有照片</p>";
              return;
            }

            // 迴圈產生成員
            result.data.forEach((photo) => {
              const item = document.createElement("div");
              item.className = "photo-item";

              // 格式化日期 (取出前10位就好)
              const dateStr = new Date(photo.uploaded_at).toLocaleDateString();

              item.innerHTML = `
                <img src="${photo.url}" alt="${photo.caption}">
                <p>${photo.caption || "無描述"}</p>
                <small>上傳日期: ${dateStr}</small>
              `;
              gallery.appendChild(item);
            });
          } else {
            gallery.innerHTML = "查詢失敗: " + result.error;
          }
        } catch (err) {
          console.error(err);
          gallery.innerHTML = "發生錯誤，請查看控制台";
        }
      }
    </script>
  </body>
</html>
