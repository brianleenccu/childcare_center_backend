<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>圖片上傳與修改系統</title>
    <style>
      body {
        font-family: sans-serif;
        max-width: 600px;
        margin: 20px auto;
      }
      .section-box {
        border: 2px solid #ccc;
        padding: 20px;
        margin-bottom: 20px;
        border-radius: 8px;
        background-color: #f9f9f9;
      }
      .form-group {
        margin-bottom: 15px;
      }
      label {
        display: inline-block;
        width: 100px;
        font-weight: bold;
      }
      input {
        padding: 5px;
        width: 250px;
      }
      button {
        padding: 8px 15px;
        font-weight: bold;
        cursor: pointer;
      }
      .update-btn {
        background-color: #ff9800;
        color: white;
        border: none;
        border-radius: 4px;
      }
      .upload-btn {
        background-color: #4caf50;
        color: white;
        border: none;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div class="section-box">
      <h2>1. 設施照片上傳</h2>
      <div class="form-group">
        <label>中心編號:</label>
        <input type="number" id="center_id" placeholder="例如: 1" />
      </div>
      <div class="form-group">
        <label>照片說明:</label>
        <input type="text" id="caption" placeholder="請輸入說明 (如: 遊戲區)" />
      </div>
      <div class="form-group">
        <label>上傳時間:</label>
        <input type="datetime-local" id="uploaded_at" />
      </div>
      <div class="form-group">
        <label>選擇圖片:</label>
        <input type="file" id="photo" />
      </div>
      <button class="upload-btn" onclick="uploadPhoto()">上傳照片</button>
      <img id="preview" width="300" style="display: block; margin-top: 10px" />
    </div>

    <div class="section-box">
      <h2>2. 修改照片說明 (Update)</h2>
      <div class="form-group">
        <label>中心編號:</label>
        <input type="number" id="update_center_id" placeholder="如: 3" />
      </div>
      <div class="form-group">
        <label>照片 ID:</label>
        <input type="number" id="update_photo_id" placeholder="如: 2" />
      </div>
      <div class="form-group">
        <label>新說明文字:</label>
        <input
          type="text"
          id="update_caption"
          placeholder="請輸入新的說明文字"
        />
      </div>
      <button class="update-btn" onclick="updatePhotoCaption()">
        修改說明
      </button>
    </div>
    <div class="section-box" style="border-color: #f44336">
      <h2>3. 刪除照片 (Delete)</h2>
      <div class="form-group">
        <label>中心編號:</label>
        <input type="number" id="delete_center_id" placeholder="如: 3" />
      </div>
      <div class="form-group">
        <label>照片 ID:</label>
        <input type="number" id="delete_photo_id" placeholder="如: 2" />
      </div>
      <button
        class="update-btn"
        style="background-color: #f44336"
        onclick="deletePhotoRecord()"
      >
        刪除照片
      </button>
    </div>

    <h3>API 執行結果：</h3>
    <pre
      id="result"
      style="
        background: #222;
        color: #0f0;
        padding: 15px;
        border-radius: 5px;
        overflow-x: auto;
      "
    ></pre>

    <script>
      // --- 原有的上傳功能 ---
      async function uploadPhoto() {
        const fileInput = document.getElementById("photo");
        const center_id = document.getElementById("center_id").value;
        const caption = document.getElementById("caption").value;
        let uploaded_at = document.getElementById("uploaded_at").value;

        if (!fileInput.files[0] || !center_id) {
          alert("請填寫中心編號並選擇檔案");
          return;
        }

        const formData = new FormData();
        formData.append("photoblob", fileInput.files[0]);
        formData.append("center_id", center_id);
        formData.append("caption", caption);
        formData.append(
          "uploaded_at",
          uploaded_at
            ? new Date(uploaded_at).toISOString()
            : new Date().toISOString()
        );

        try {
          const response = await fetch("/api/photo/upload", {
            method: "POST",
            body: formData,
          });
          const result = await response.json();
          document.getElementById("result").innerText =
            "【上傳結果】\n" + JSON.stringify(result, null, 2);
          if (result.imageUrl)
            document.getElementById("preview").src = result.imageUrl;
        } catch (err) {
          document.getElementById("result").innerText = "發生錯誤: " + err;
        }
      }

      // --- 新增的修改功能 (PATCH) ---
      async function updatePhotoCaption() {
        const centerId = document.getElementById("update_center_id").value;
        const photoId = document.getElementById("update_photo_id").value;
        const newCaption = document.getElementById("update_caption").value;

        if (!centerId || !photoId || !newCaption) {
          alert("請填寫所有欄位！");
          return;
        }

        try {
          // 網址現在需要同時帶入 centerId 和 photoId
          const response = await fetch(
            `/api/photo/${centerId}/${photoId}/caption`,
            {
              method: "PATCH",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({ caption: newCaption }),
            }
          );

          const result = await response.json();
          document.getElementById("result").innerText =
            "【修改結果】\n" + JSON.stringify(result, null, 2);
        } catch (err) {
          document.getElementById("result").innerText = "發生錯誤: " + err;
        }
      }
      // --- 新增的刪除功能 (DELETE) ---
      async function deletePhotoRecord() {
        const centerId = document.getElementById("delete_center_id").value;
        const photoId = document.getElementById("delete_photo_id").value;

        if (!centerId || !photoId) {
          alert("請填寫中心編號與照片 ID！");
          return;
        }

        // 加上確認視窗，防止誤刪
        if (!confirm(`確定要刪除 中心 ${centerId} 的 第 ${photoId} 張照片嗎？`))
          return;

        try {
          const response = await fetch(`/api/photo/${centerId}/${photoId}`, {
            method: "DELETE",
          });

          const result = await response.json();
          document.getElementById("result").innerText =
            "【刪除結果】\n" + JSON.stringify(result, null, 2);
        } catch (err) {
          document.getElementById("result").innerText = "發生錯誤: " + err;
        }
      }
    </script>
  </body>
</html>
