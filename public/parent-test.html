<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <title>👨‍👩‍👧 家長入口 - 註冊與登入系統</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        padding: 20px;
        max-width: 850px;
        margin: 0 auto;
        background-color: #f4f7f6;
      }
      h1 {
        text-align: center;
        color: #333;
      }
      .container {
        display: flex;
        gap: 20px;
        margin-top: 20px;
      }
      .box {
        background-color: #ffffff;
        border: 1px solid #ddd;
        padding: 25px;
        border-radius: 10px;
        flex: 1;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
      }
      .box h2 {
        margin-top: 0;
        color: #444;
        border-bottom: 2px solid #eee;
        padding-bottom: 10px;
      }
      .form-group {
        margin-bottom: 15px;
      }
      label {
        display: block;
        font-weight: bold;
        margin-bottom: 5px;
        color: #555;
      }
      input {
        padding: 10px;
        width: calc(100% - 22px); /* 扣除 padding 寬度 */
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 14px;
      }
      input:focus {
        border-color: #007bff;
        outline: none;
      }
      button {
        padding: 10px 20px;
        width: 100%;
        cursor: pointer;
        background-color: #28a745;
        color: white;
        border: none;
        border-radius: 5px;
        font-weight: bold;
        font-size: 16px;
        transition: background-color 0.3s;
      }
      button:hover {
        background-color: #218838;
      }
      button.login-btn {
        background-color: #007bff;
      }
      button.login-btn:hover {
        background-color: #0069d9;
      }
      pre {
        background: #2d2d2d;
        color: #56db3a;
        padding: 15px;
        border-radius: 8px;
        overflow-x: auto;
        white-space: pre-wrap;
        font-family: "Courier New", Courier, monospace;
      }
    </style>
  </head>
  <body>
    <h1>👨‍👩‍👧 家長入口 - 測試區</h1>
    <p style="text-align: center; color: #666">
      請先註冊家長帳號，再使用同一組信箱密碼登入測試 JWT Token。
    </p>

    <div class="container">
      <div class="box">
        <h2>1. 註冊家長帳號</h2>
        <div class="form-group">
          <label>家長姓名:</label>
          <input type="text" id="reg_name" placeholder="如: 陳媽媽" required />
        </div>
        <div class="form-group">
          <label>Email (帳號):</label>
          <input
            type="email"
            id="reg_email"
            placeholder="如: mom@test.com"
            required
          />
        </div>
        <div class="form-group">
          <label>聯絡電話:</label>
          <input
            type="text"
            id="reg_phone"
            placeholder="如: 0912345678"
            required
          />
        </div>
        <div class="form-group">
          <label>設定密碼:</label>
          <input
            type="password"
            id="reg_password"
            placeholder="請輸入密碼"
            required
          />
        </div>
        <button onclick="registerParent()">建立家長帳號</button>
      </div>

      <div class="box">
        <h2>2. 家長登入</h2>
        <div class="form-group">
          <label>Email:</label>
          <input
            type="email"
            id="login_email"
            placeholder="輸入註冊的 Email"
            required
          />
        </div>
        <div class="form-group">
          <label>密碼:</label>
          <input
            type="password"
            id="login_password"
            placeholder="輸入密碼"
            required
          />
        </div>
        <button class="login-btn" onclick="loginParent()">
          登入 (獲取 JWT)
        </button>
      </div>
    </div>

    <h3>📡 API 回傳結果：</h3>
    <pre id="result">等待操作中...</pre>

    <script>
      const resultDiv = document.getElementById("result");

      // --- 家長註冊 API ---
      async function registerParent() {
        const name = document.getElementById("reg_name").value;
        const email = document.getElementById("reg_email").value;
        const phone = document.getElementById("reg_phone").value;
        const password = document.getElementById("reg_password").value;

        if (!name || !email || !phone || !password) {
          resultDiv.innerText = "⚠️ 請填寫所有的註冊欄位！";
          return;
        }

        try {
          resultDiv.innerText = "⏳ 註冊中，請稍候...";
          const response = await fetch("/api/parent/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, email, phone, password }),
          });

          const result = await response.json();
          resultDiv.innerText =
            "【📝 註冊 API 回傳】\n" + JSON.stringify(result, null, 2);
        } catch (error) {
          resultDiv.innerText = "❌ 發生錯誤: " + error;
        }
      }

      // --- 家長登入 API ---
      async function loginParent() {
        const email = document.getElementById("login_email").value;
        const password = document.getElementById("login_password").value;

        if (!email || !password) {
          resultDiv.innerText = "⚠️ 請填寫登入的 Email 與密碼！";
          return;
        }

        try {
          resultDiv.innerText = "⏳ 登入驗證中，請稍候...";
          const response = await fetch("/api/parent/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password }),
          });

          const result = await response.json();
          resultDiv.innerText =
            "【🔐 登入 API 回傳】\n" + JSON.stringify(result, null, 2);

          if (result.success && result.token) {
            // 將 Token 存入瀏覽器的 localStorage 中
            localStorage.setItem("parentToken", result.token);
            alert(
              "🎉 登入成功！家長端 JWT Token 已核發並儲存！\n你可以打開 F12 -> Application -> Local Storage 檢查。"
            );
          }
        } catch (error) {
          resultDiv.innerText = "❌ 發生錯誤: " + error;
        }
      }
    </script>
  </body>
</html>
